name: discover

# Hourly discovery run. The interval is operator-controlled through the
# OPENRADAR_RUN_HOURS repo variable (1-24, default 1 = hourly). GitHub
# Actions cron is static, so the schedule fires hourly at :17 and a gate
# STEP decides whether this is "the one" for intervals > 1 (UTC hour
# divisible by N — the same semantics the old `17 */N` cron matrix had).
#
# The gate deliberately lives in a step, not in the job-level `if`: a
# job-if expression cannot see the job's own env context, and referencing
# it invalidates the whole workflow file ("Unrecognized named-value:
# 'env'") — which silently disabled every scheduled and push run before.
on:
  push:
    branches: [main]
    # The agent's own snapshot/changelog commits don't need another run —
    # they only need the Vercel redeploy that the push itself triggers.
    paths-ignore:
      - "data/**"
  schedule:
    - cron: "17 * * * *" # hourly, gated by OPENRADAR_RUN_HOURS
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you triggering a manual run?"
        required: false
        default: "manual"

permissions:
  contents: write
  issues: write # the agent ingests + closes Submit-form issues

env:
  # Operator-controlled interval in hours (1-24). Default 1 (hourly),
  # matching agent.run_interval_hours in data/config.json.
  OPENRADAR_RUN_HOURS: ${{ vars.OPENRADAR_RUN_HOURS || '1' }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Interval gate
        id: gate
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hours="${OPENRADAR_RUN_HOURS:-1}"
          case "$hours" in ''|*[!0-9]*) hours=1 ;; esac
          [ "$hours" -lt 1 ] && hours=1
          [ "$hours" -gt 24 ] && hours=24
          hour=$(date -u +%-H)
          if [ "$hours" -eq 1 ] || [ $((hour % hours)) -eq 0 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "interval is ${hours}h and UTC hour $hour is not a multiple of it — skipping"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.proceed == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: "3.12"

      - name: Install agent
        if: steps.gate.outputs.proceed == 'true'
        working-directory: apps/agent
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run discovery
        if: steps.gate.outputs.proceed == 'true'
        working-directory: apps/agent
        env:
          # Lets the agent ingest + close provider submissions filed as
          # GitHub issues by the deployed site's Submit form.
          GH_TOKEN: ${{ github.token }}
          OPENRADAR_GITHUB_REPO: ${{ github.repository }}
          # Optional — set these as repo secrets to unlock extra sources.
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python -m openradar.cli

      - name: Append human-readable changelog
        if: always() && steps.gate.outputs.proceed == 'true'
        run: |
          python - <<'PY'
          import json, datetime, pathlib
          snap = json.loads(pathlib.Path("data/snapshot.json").read_text())
          md = pathlib.Path("data/changelog.md")
          old = md.read_text() if md.exists() else "# OpenRadar changelog\n\n"
          new_rows = [c for c in snap["changelog"][:30]]
          stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          block = [f"## {stamp}"] + [f"- **{c['kind']}** — {c['text']}" for c in new_rows] + [""]
          md.write_text(old + "\n".join(block))
          PY

      - name: Commit if changed
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "openradar-bot"
          git config user.email "bot@openradar.local"
          git add data/snapshot.json data/changelog.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "agent: refresh ($(date -u +%FT%TZ))"
            git push
          fi
